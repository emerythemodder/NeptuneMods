<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neptune</title>
    <meta name="description" content="Find and publish Minecraft mods, modpacks, shaders and more. Search Neptune, Modrinth and CurseForge in one place." />
    <link rel="canonical" href="https://neptunemc.com/" />
    <meta property="og:site_name" content="Neptune" />
    <meta property="og:title" content="Neptune" />
    <meta property="og:description" content="Find and publish Minecraft mods, modpacks, shaders and more." />
    <meta property="og:url" content="https://neptunemc.com/" />
    <meta property="og:image" content="https://neptunemc.com/planet.webp" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./logo.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#100d16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("neptune:settings") || "{}");
        var t = s.theme === "light" || (s.theme === "system" && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
